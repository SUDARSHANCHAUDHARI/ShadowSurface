[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowsurface"
version = "1.0.0"
description = "Attack surface monitoring MVP for domains, SSL, ports, exposed admin paths, and subdomain risks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
shadow-surface = "apps.api.app.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["apps*"]
exclude = ["apps.web*"]
